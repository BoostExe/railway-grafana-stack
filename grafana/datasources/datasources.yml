# Configuration file version
# See here fore more information on configuration:
# https://grafana.com/docs/grafana/latest/administration/provisioning/#example-data-source-configuration-file
apiVersion: 1

# Mark provisioned data sources for deletion if they are no longer in a provisioning file.
prune: false

# List of data sources to insert/update depending on what's available.
datasources:
  - name: Loki
    type: loki
    access: direct
    orgId: 1
    uid: grafana_lokiq
    url: $LOKI_INTERNAL_URL
    jsonData:
      # Loki stores OTLP trace ids as `trace_id` structured metadata; link them to Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: grafana_tempo
          url: '$${__value.raw}'
          urlDisplayLabel: Open trace
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: true
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: grafana_prometheus
    url: $PROMETHEUS_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    uid: grafana_tempo
    url: $TEMPO_INTERNAL_URL
    jsonData:
      tracesToLogsV2:
        datasourceUid: grafana_lokiq
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceId: true
        customQuery: true
        query: '{service_name="bxtool_service"} | trace_id="$${__trace.traceId}"'
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false